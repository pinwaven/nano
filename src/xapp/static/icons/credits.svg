<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A0B2FF"/>
      <stop offset="100%" stop-color="#5060D8"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C8D4FF"/>
    </linearGradient>
  </defs>
  <!-- Coin body -->
  <circle cx="20" cy="20" r="19" fill="url(#coin)"/>
  <!-- Inner ring for coin depth -->
  <circle cx="20" cy="20" r="15.5" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="none"/>
  <!-- 5-pointed star (universal credits/points symbol) -->
  <path d="M20,10 L22.6,16.4 L29.5,16.9 L24.3,21.4 L25.9,28.1 L20,24.5 L14.1,28.1 L15.7,21.4 L10.5,16.9 L17.4,16.4 Z" fill="url(#star)"/>
  <!-- Shine highlight -->
  <circle cx="15" cy="14" r="2" fill="rgba(255,255,255,0.5)"/>
</svg>
