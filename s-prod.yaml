edition: 3.0.0
name: nano-ai
access: default

vars:
  region: cn-shanghai
  logProject: nano-ai-logs
  logStore: nano-ai-logstore

resources:
  dispatcher:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-dispatcher
      runtime: nodejs20
      handler: index.handler
      memorySize: 128
      timeout: 60
      code: ./src/functions/dispatcher
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        DB_HOST: "amclbdsyqvfq.rwlb.rds.aliyuncs.com"
        DB_NAME: "nano_db"
        DB_USER: "nano_admin"
        DB_PASS: ${env(DB_PASS)}
        DB_SSL: "false"
        TZ: "Asia/Shanghai"
        WORKER_URL: "https://nano-worker-napllanrqp.cn-shanghai-vpc.fcapp.run"
        WORKER_FUNCTION_NAME: "nano-worker"
        AGENT_URL: "https://nano-agent-napllanrqp.cn-shanghai-vpc.fcapp.run"
      triggers:
        - triggerName: cron-scanner
          triggerType: timer
          triggerConfig:
            payload: ""
            cronExpression: "0 * * * * *" # Every minute for testing/utilization
            enable: true

  worker:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-worker
      runtime: nodejs20
      handler: index.handler
      memorySize: 512
      timeout: 300
      code: ./src/functions/worker
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        DB_HOST: "amclbdsyqvfq.rwlb.rds.aliyuncs.com"
        DB_NAME: "nano_db"
        DB_USER: "nano_admin"
        DB_PASS: ${env(DB_PASS)}
        DB_SSL: "false"
        TZ: "Asia/Shanghai"
        DASHSCOPE_API_KEY: ${env(DASHSCOPE_API_KEY)}
        MODEL: "qwen-plus-latest"
        WX_APPID: "wxecbcf00ce480fcf2"
        WX_SECRET: ${env(WX_SECRET)}
        WX_APPID_WAVEN: "wx84bd7d00a6fd626e"
        WX_SECRET_WAVEN: ${env(WX_SECRET_WAVEN)}
        NODE_ENV: "production"
        WX_WEIGHT_TMPL_ID: ${env(WX_WEIGHT_TMPL_ID)}
        API_BEARER_TOKEN: ${env(API_BEARER_TOKEN)}
        GCN_API_TOKEN: ${env(GCN_API_TOKEN)}
        GCN_API_BASE_URL: "https://edge.gcn.net"
        GCN_SERVICE_TOKEN: ${env(GCN_SERVICE_TOKEN)}
        OSS_REGION: "oss-cn-shanghai"
        OSS_BUCKET: "waven-nano"
        OSS_ACCESS_KEY_ID: ${env(OSS_ACCESS_KEY_ID)}
        OSS_ACCESS_KEY_SECRET: ${env(OSS_ACCESS_KEY_SECRET)}
        KONE_APK_CNAME_DOMAIN: ${env(KONE_APK_CNAME_DOMAIN)}
        OSS_CNAME_DOMAIN: ${env(OSS_CNAME_DOMAIN)}
        MEDIA_URL: "https://nano-media-napllanrqp.cn-shanghai-vpc.fcapp.run"
        # Phone+OTP login (PNVS/dypnsapi) — same account as OSS, already has dypnsapi
        # permission (see gcn's docs/pnvs.md). No separate SMS credential provisioned.
        SMS_ACCESS_KEY_ID: ${env(OSS_ACCESS_KEY_ID)}
        SMS_ACCESS_KEY_SECRET: ${env(OSS_ACCESS_KEY_SECRET)}
      triggers:
        - triggerName: http-webhook
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        - triggerName: eb-trigger
          triggerType: eventbridge
          triggerConfig:
            eventSourceConfig:
              eventSourceType: Default
            eventRuleFilterPattern: '{"source":["acs.dispatcher","acs.lab"]}'

  agent:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-agent
      runtime: nodejs20
      handler: index.handler
      memorySize: 256
      timeout: 60
      code: ./src/functions/agent
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        DB_HOST: "amclbdsyqvfq.rwlb.rds.aliyuncs.com"
        DB_NAME: "nano_db"
        DB_USER: "nano_admin"
        DB_PASS: ${env(DB_PASS)}
        DB_SSL: "false"
        TZ: "Asia/Shanghai"
        DASHSCOPE_API_KEY: ${env(DASHSCOPE_API_KEY)}
        MODEL: "qwen-plus-latest"
      triggers:
        - triggerName: http-agent
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["POST"]
        - triggerName: eb-agent-trigger
          triggerType: eventbridge
          triggerConfig:
            eventSourceConfig:
              eventSourceType: Default
            eventRuleFilterPattern: '{"source":["acs.dispatcher"],"type":["agent.coaching_session"]}'

  lab:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-lab
      runtime: nodejs20
      handler: index.handler
      memorySize: 512
      timeout: 600
      code: ./src/functions/lab
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        DB_HOST: "amclbdsyqvfq.rwlb.rds.aliyuncs.com"
        DB_NAME: "nano_db_prod"
        DB_USER: "nano_admin"
        DB_PASS: ${env(DB_PASS)}
        DB_SSL: "false"
        TZ: "Asia/Shanghai"
        LAB_WEBHOOK_SECRET: ${env(LAB_WEBHOOK_SECRET)}
      triggers:
        - triggerName: lab-http
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["POST"]
        - triggerName: lab-poll
          triggerType: timer
          triggerConfig:
            payload: ""
            cronExpression: "0 0 */4 * * *"
            enable: true

  kino:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-kino
      runtime: nodejs20
      handler: index.handler
      memorySize: 256
      timeout: 60
      code: ./src/functions/kino
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        DB_HOST: "amclbdsyqvfq.rwlb.rds.aliyuncs.com"
        DB_NAME: "nano_db"
        DB_USER: "nano_admin"
        DB_PASS: ${env(DB_PASS)}
        DB_SSL: "false"
        TZ: "Asia/Shanghai"
        API_BEARER_TOKEN: ${env(API_BEARER_TOKEN)}
        KINO_ACTIVATION_TOKEN: "JND7MAED2wd4QUG7rMlG3_YpU0B_lqOjVM_LFsFzcdA"
        KINO_ROOT_TOKEN_ENCRYPTION_KEY: "935eb5474873526ee812addf266aa69266c704e5d16e6d67cae83e0b79a6f155"
        KINO_COMM_TOKEN_TTL_DAYS: "7"
      triggers:
        - triggerName: kino-http
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]

  media:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-media
      runtime: nodejs20
      handler: index.handler
      memorySize: 1024
      timeout: 60
      code: ./src/functions/media
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        TZ: "Asia/Shanghai"
        API_BEARER_TOKEN: ${env(API_BEARER_TOKEN)}
        OSS_REGION: "oss-cn-shanghai"
        OSS_BUCKET: "waven-nano"
        OSS_ACCESS_KEY_ID: ${env(OSS_ACCESS_KEY_ID)}
        OSS_ACCESS_KEY_SECRET: ${env(OSS_ACCESS_KEY_SECRET)}
      triggers:
        - triggerName: media-http
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["POST", "OPTIONS"]

  admin-panel:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-admin-panel
      runtime: nodejs20
      handler: index.handler
      memorySize: 128
      timeout: 30
      code: ./src/functions/admin-panel
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        WORKER_URL: "https://nano-worker-napllanrqp.cn-shanghai-vpc.fcapp.run"
        TZ: "Asia/Shanghai"
      triggers:
        - triggerName: http-admin
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]

  user-app:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-user-app
      runtime: nodejs20
      handler: index.handler
      memorySize: 128
      timeout: 30
      code: ./src/functions/user-app
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        TZ: "Asia/Shanghai"
      triggers:
        - triggerName: http-user-app
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["GET", "OPTIONS"]

  nano-domain:
    component: fc3-domain
    props:
      region: ${vars.region}
      domainName: nano.gcn.net
      protocol: HTTP,HTTPS
      certConfig:
        certName: nano-custom-cert
        certificate: ./certs/cert.pem
        privateKey: ./certs/key.pem
      routeConfig:
        routes:
          - path: /QJaeMN3iR8.txt
            functionName: nano-worker
          - path: /api/*
            functionName: nano-worker
          - path: /api
            functionName: nano-worker
          - path: /app/*
            functionName: nano-user-app
          - path: /app
            functionName: nano-user-app
          - path: /admin/api/*
            functionName: nano-admin-panel
          - path: /admin/*
            functionName: nano-admin-panel
          - path: /admin
            functionName: nano-admin-panel
          - path: /worker
            functionName: nano-worker
          - path: /agent/*
            functionName: nano-agent
          - path: /agent
            functionName: nano-agent
          - path: /kino/*
            functionName: nano-kino
          - path: /kino
            functionName: nano-kino
          - path: /lab/*
            functionName: nano-lab
          - path: /lab
            functionName: nano-lab
