import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'io.dcloud.uts.kotlin'
}

def xappManifest = new JsonSlurper().parse(file('../../../../src/xapp/manifest.json'))
def androidConfig = xappManifest.app.distribute.android
def registrations = [
    'DCloudUniActionSheet.UniActionSheetExtApiPagesRegister',
    'DCloudUniModal.UniModalExtApiPagesRegister',
    'DCloudUniShowLoading.UniShowLoadingExtApiPagesRegister',
    'DCloudUniLoading.UniLoadingExtApiComponentsRegister',
    'DCloudUniPreviewImage.UniPreviewImageExtApiPagesRegister',
    'DCloudUniScanCode.UniScanCodeExtApiPagesRegister',
    'DCloudUniRichText.UniRichTextExtApiComponentsRegister',
    'DCloudUniWebView.UniWebViewExtApiComponentsRegister',
    'DCloudUniCamera.UniCameraExtApiComponentsRegister',
    'DCloudUniVideo.UniVideoExtApiComponentsRegister',
    'DCloudUniPicker.UniPickerExtApiPagesRegister',
    'DCloudUniPicker.UniPickerExtApiComponentsRegister'
].collect { [class: "uts.sdk.modules.${it}", method: 'register'] }

android {
    namespace 'net.gcn.nano'
    compileSdk 35
    defaultConfig {
        applicationId androidConfig.packagename
        minSdk androidConfig.minSdkVersion as int
        targetSdk androidConfig.targetSdkVersion as int
        versionCode xappManifest.versionCode as int
        versionName xappManifest.versionName
        ndk { abiFilters.addAll(androidConfig.abiFilters) }
        buildConfigField 'String', 'UTSEasyCom', JsonOutput.toJson(JsonOutput.toJson(registrations))
        buildConfigField 'String', 'UTSRegisterComponents', JsonOutput.toJson(JsonOutput.toJson([
            [name: 'canvas', class: 'io.dcloud.canvas.CanvasComponent', node: 'io.dcloud.canvas.UniCanvasElementImpl'],
            [name: 'video', class: 'uts.sdk.modules.DCloudUniVideo.VideoComponent']
        ]))
        buildConfigField 'String[]', 'UTSHooksClassArray', '{"uts.sdk.modules.DCloudUniOpenDocument.UniOpenDocumentHookProxy","uts.sdk.modules.DCloudUniBarcodeScanning.AppHookProxy"}'
        buildConfigField 'String', 'UTSRegisterProviders', '"[]"'
    }
    buildFeatures { buildConfig true }
    sourceSets {
        main {
            java.srcDirs += 'src/generated/java'
            assets.srcDirs += 'src/generated/assets'
            res.srcDirs += 'src/generated/res'
            manifest.srcFile 'src/generated/AndroidManifest.xml'
        }
    }
    signingConfigs {
        release {
            if (System.getenv('XAPP_KEYSTORE')) {
                storeFile file(System.getenv('XAPP_KEYSTORE'))
                storePassword System.getenv('XAPP_STORE_PASSWORD')
                keyAlias System.getenv('XAPP_KEY_ALIAS')
                keyPassword System.getenv('XAPP_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~'
    }
    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.6.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta02'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'com.facebook.fresco:fresco:3.4.0'
    implementation 'com.facebook.fresco:middleware:3.4.0'
    implementation 'com.facebook.fresco:animated-gif:3.4.0'
    implementation 'com.facebook.fresco:webpsupport:3.4.0'
    implementation 'com.facebook.fresco:animated-webp:3.4.0'
    implementation 'com.caverock:androidsvg:1.4'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:3.12.12'
    implementation 'com.github.getActivity:XXPermissions:18.63'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    implementation 'com.github.albfernandez:juniversalchardet:2.0.4'
    implementation 'org.brotli:dec:0.1.2'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
}
