edition: 3.0.0
name: nano-ai
access: default

vars:
  region: cn-shanghai
  logProject: nano-ai-logs
  logStore: nano-ai-logstore

resources:
  dispatcher:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-dispatcher-dev
      runtime: nodejs20
      handler: index.handler
      memorySize: 128
      timeout: 60
      code: ./src/functions/dispatcher
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        DB_HOST: "amclbdsyqvfq.rwlb.rds.aliyuncs.com"
        DB_NAME: "nano_db_dev"
        DB_USER: "nano_admin"
        DB_PASS: ${env(DB_PASS)}
        DB_SSL: "false"
        TZ: "Asia/Shanghai"
        # Found and fixed 2026-08-01 alongside the EventBridge source-scoping incident: this
        # WORKER_URL/AGENT_URL pair was an exact copy of s-prod.yaml's values (the prod VPC-
        # internal URLs), not dev's own. It's only used as dispatcher's HTTP fallback when the
        # primary EventBridge publish itself throws — a rarer path than the EventBridge one, but
        # a hit on it would have silently POSTed dev's dispatch payloads straight to production.
        WORKER_URL: "https://nano-worker-dev-wvjxlgrinl.cn-shanghai-vpc.fcapp.run"
        WORKER_FUNCTION_NAME: "nano-worker-dev"
        AGENT_URL: "https://nano-agent-dev-fbbhyrqxpd.cn-shanghai-vpc.fcapp.run"
        EVENT_SOURCE_SUFFIX: ".dev"
      triggers:
        - triggerName: cron-scanner
          triggerType: timer
          triggerConfig:
            payload: ""
            cronExpression: "0 * * * * *" # Every minute for testing/utilization
            enable: true

  worker:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-worker-dev
      runtime: nodejs20
      handler: index.handler
      memorySize: 512
      timeout: 300
      code: ./src/functions/worker
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        DB_HOST: "amclbdsyqvfq.rwlb.rds.aliyuncs.com"
        DB_NAME: "nano_db_dev"
        DB_USER: "nano_admin"
        DB_PASS: ${env(DB_PASS)}
        DB_SSL: "false"
        TZ: "Asia/Shanghai"
        DASHSCOPE_API_KEY: ${env(DASHSCOPE_API_KEY)}
        # Workspace-dedicated Model Studio domain (cn-beijing). Code falls back to the shared
        # dashscope.aliyuncs.com host when unset — see docs/deployment.md.
        DASHSCOPE_HOST: "https://llm-u2y1wl9irqjstpnp.cn-beijing.maas.aliyuncs.com"
        MODEL: "qwen-plus-latest"
        # The UNDERSTAND step (CLAUDE.md 47). "on" here so dev actually routes on it; prod runs
        # "shadow" (both routers, classifier decides, disagreements logged) until the prod traffic
        # comparison says otherwise. "off" restores the classifier-only behaviour with no deploy.
        CHAT_UNDERSTANDING_MODE: "on"
        UNDERSTANDING_MODEL: "qwen3.8-flash"
        WX_APPID: "wxecbcf00ce480fcf2"
        WX_SECRET: ${env(WX_SECRET)}
        WX_APPID_WAVEN: "wx84bd7d00a6fd626e"
        WX_SECRET_WAVEN: ${env(WX_SECRET_WAVEN)}
        WX_WEIGHT_TMPL_ID: ${env(WX_WEIGHT_TMPL_ID)}
        API_BEARER_TOKEN: ${env(API_BEARER_TOKEN)}
        GCN_API_TOKEN: ${env(GCN_API_TOKEN)}
        # Scoped external credential for the viva-ag advanced-generation agent (CLAUDE.md 35).
        # Distinct token per environment ON PURPOSE: dev and prod share the OSS bucket and the
        # Aliyun account, so one shared token would let a dev-configured external agent claim
        # and answer real prod users' jobs. Must NOT start with "ch." — that prefix is claimed
        # by the channel-admin JWT branch in worker/index.js and would 401. Issue as
        # "vag_" + 32 hex.
        VIVA_AG_API_TOKEN: ${env(VIVA_AG_API_TOKEN)}
        # Scoped external credential for the document-extraction agent. A SEPARATE service from
        # viva-ag even though the same platform runs both, so it gets its own token: extraction is
        # available to every user while AG is a paid add-on, and one credential covering both would
        # mean a compromise of the cheap, widely-used service also opened the queue of paid deep
        # analyses. Same per-environment split and same "ch." prohibition as above. Issue as
        # "dex_" + 32 hex.
        DOC_EXTRACT_API_TOKEN: ${env(DOC_EXTRACT_API_TOKEN)}
        # Generous on dev: the code default (3/day, handlers/viva_ag.js) makes the feature
        # untestable after three runs — hit live during dev testing. Prod sets its own value
        # (10) in s-prod.yaml.
        VIVA_AG_MAX_JOBS_PER_DAY: "50"
        AVATAR_GEN_MODEL: "qwen-image-3.0"
        AVATAR_GEN_MAX_PER_DAY: "3"
        GCN_API_BASE_URL: "https://edge-dev.gcn.net"
        # Public aeviva sector site — where the formulation label QR points. Distinct from
        # GCN_API_BASE_URL (the server-to-server API edge): this one is a link a person opens,
        # and it is a verified WeChat business domain so <web-view> can load it.
        AEVIVA_SITE_BASE_URL: "https://aeviva-dev.gcn.net"
        GCN_SERVICE_TOKEN: ${env(GCN_SERVICE_TOKEN)}
        OSS_REGION: "oss-cn-shanghai"
        OSS_BUCKET: "waven-nano"
        OSS_ACCESS_KEY_ID: ${env(OSS_ACCESS_KEY_ID)}
        OSS_ACCESS_KEY_SECRET: ${env(OSS_ACCESS_KEY_SECRET)}
        KONE_APK_CNAME_DOMAIN: ${env(KONE_APK_CNAME_DOMAIN)}
        OSS_CNAME_DOMAIN: ${env(OSS_CNAME_DOMAIN)}
        MEDIA_URL: "https://nano-media-napllanrqp.cn-shanghai-vpc.fcapp.run"
        # Phone+OTP login (PNVS/dypnsapi) — same account as OSS, already has dypnsapi
        # permission (see gcn's docs/pnvs.md). No separate SMS credential provisioned.
        SMS_ACCESS_KEY_ID: ${env(OSS_ACCESS_KEY_ID)}
        SMS_ACCESS_KEY_SECRET: ${env(OSS_ACCESS_KEY_SECRET)}
        # Admin-impersonation "super OTP" kill switch — see phone-otp.js's SUPER_OTP_CODE.
        # Deliberately set "true" in BOTH dev and prod (unlike most dev-only flags in this
        # file) since the whole point is debugging real accounts, which mostly live in prod.
        SUPER_OTP_ENABLED: "true"
        # PNVS_SIGN_NAME/PNVS_TEMPLATE_CODE are optional — lib/sms.js defaults to the
        # verified system-provided pair (恒创联众 / 100001).
        # Email OTP via Aliyun DirectMail (lib/email.js). DM_ACCOUNT_NAME is the verified sender
        # address and is ALSO the dev-bypass switch: empty, and lib/email.js logs the code
        # (email-otp-dev-bypass) instead of sending — keyed on the sender rather than on the
        # AK because the AK below is shared with OSS/PNVS and is always present. Dev is a
        # literal "" on purpose (Serverless Devs rejects ${env()} of an empty value); set it to
        # the real sender here only to test actual delivery from dev. Credentials default to
        # SMS_ACCESS_KEY_* (same root AK); DM_ACCESS_KEY_* exist only to move the sender to a
        # scoped RAM user later. Region cn-hangzhou, same as the PNVS client.
        DM_ACCOUNT_NAME: "no-reply@mail.gcn.net"
        DM_FROM_ALIAS: "Waven Nano"
        # Dev/prod share one EventBridge bus (same Aliyun account) — nano-worker-dev and
        # nano-worker (prod) both had eb-triggers filtering on the bare "acs.chat" source,
        # so a dev-published chat.generate event was also picked up and processed by prod's
        # (different) deployed code, leaking a raw unstripped LLM action tail into a real
        # user's live chat history (found 2026-08-01). This suffix makes dev publish/consume
        # chat.generate under "acs.chat.dev" instead — prod is left unset (defaults to the
        # original "acs.chat"), so this is a dev-only opt-in requiring no prod change. Renamed
        # from CHAT_EVENT_SOURCE_SUFFIX and extended the same day to also scope acs.lab (from
        # lab/index.js) and acs.dispatcher (from dispatcher/index.js), which had the identical
        # unscoped-filter exposure — see dispatcher/index.js's DISPATCHER_EVENT_SOURCE comment.
        EVENT_SOURCE_SUFFIX: ".dev"
      triggers:
        - triggerName: http-webhook
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        - triggerName: eb-trigger
          triggerType: eventbridge
          triggerConfig:
            eventSourceConfig:
              eventSourceType: Default
            eventRuleFilterPattern: '{"source":["acs.dispatcher.dev","acs.lab.dev","acs.chat.dev"]}'

  agent:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-agent-dev
      runtime: nodejs20
      handler: index.handler
      memorySize: 256
      timeout: 60
      code: ./src/functions/agent
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        DB_HOST: "amclbdsyqvfq.rwlb.rds.aliyuncs.com"
        DB_NAME: "nano_db_dev"
        DB_USER: "nano_admin"
        DB_PASS: ${env(DB_PASS)}
        DB_SSL: "false"
        TZ: "Asia/Shanghai"
        DASHSCOPE_API_KEY: ${env(DASHSCOPE_API_KEY)}
        # Workspace-dedicated Model Studio domain (cn-beijing). Code falls back to the shared
        # dashscope.aliyuncs.com host when unset — see docs/deployment.md.
        DASHSCOPE_HOST: "https://llm-u2y1wl9irqjstpnp.cn-beijing.maas.aliyuncs.com"
        MODEL: "qwen-plus-latest"
        # See worker's EVENT_SOURCE_SUFFIX comment — same 2026-08-01 fix, applied here since
        # nano-agent/nano-agent-dev's eb-agent-triggers had the identical unscoped filter.
        EVENT_SOURCE_SUFFIX: ".dev"
      triggers:
        - triggerName: http-agent
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["POST"]
        - triggerName: eb-agent-trigger
          triggerType: eventbridge
          triggerConfig:
            eventSourceConfig:
              eventSourceType: Default
            eventRuleFilterPattern: '{"source":["acs.dispatcher.dev"],"type":["agent.coaching_session"]}'

  lab:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-lab-dev
      runtime: nodejs20
      handler: index.handler
      memorySize: 512
      timeout: 600
      code: ./src/functions/lab
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        DB_HOST: "amclbdsyqvfq.rwlb.rds.aliyuncs.com"
        DB_NAME: "nano_db_dev"
        DB_USER: "nano_admin"
        DB_PASS: ${env(DB_PASS)}
        DB_SSL: "false"
        TZ: "Asia/Shanghai"
        LAB_WEBHOOK_SECRET: ${env(LAB_WEBHOOK_SECRET)}
        # See worker's EVENT_SOURCE_SUFFIX comment — same 2026-08-01 fix. lab only publishes
        # (no eb-trigger of its own), so this just changes what source string it emits.
        EVENT_SOURCE_SUFFIX: ".dev"
      triggers:
        - triggerName: lab-http
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["POST"]
        - triggerName: lab-poll
          triggerType: timer
          triggerConfig:
            payload: ""
            cronExpression: "0 0 */4 * * *"
            enable: true

  kino:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-kino-dev
      runtime: nodejs20
      handler: index.handler
      memorySize: 256
      timeout: 60
      code: ./src/functions/kino
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        DB_HOST: "amclbdsyqvfq.rwlb.rds.aliyuncs.com"
        DB_NAME: "nano_db_dev"
        DB_USER: "nano_admin"
        DB_PASS: ${env(DB_PASS)}
        DB_SSL: "false"
        TZ: "Asia/Shanghai"
        API_BEARER_TOKEN: ${env(API_BEARER_TOKEN)}
        KINO_ACTIVATION_TOKEN: "JND7MAED2wd4QUG7rMlG3_YpU0B_lqOjVM_LFsFzcdA"
        KINO_ROOT_TOKEN_ENCRYPTION_KEY: "935eb5474873526ee812addf266aa69266c704e5d16e6d67cae83e0b79a6f155"
        KINO_COMM_TOKEN_TTL_DAYS: "7"
      triggers:
        - triggerName: kino-http
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]

  media:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-media-dev
      runtime: nodejs20
      handler: index.handler
      memorySize: 1024
      timeout: 60
      code: ./src/functions/media
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        TZ: "Asia/Shanghai"
        API_BEARER_TOKEN: ${env(API_BEARER_TOKEN)}
        OSS_REGION: "oss-cn-shanghai"
        OSS_BUCKET: "waven-nano"
        OSS_ACCESS_KEY_ID: ${env(OSS_ACCESS_KEY_ID)}
        OSS_ACCESS_KEY_SECRET: ${env(OSS_ACCESS_KEY_SECRET)}
      triggers:
        - triggerName: media-http
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["POST", "OPTIONS"]

  user-app:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-user-app-dev
      runtime: nodejs20
      handler: index.handler
      memorySize: 128
      timeout: 30
      code: ./src/functions/user-app
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        TZ: "Asia/Shanghai"
      triggers:
        - triggerName: http-user-app
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["GET", "OPTIONS"]

  admin-panel:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-admin-panel-dev
      runtime: nodejs20
      handler: index.handler
      memorySize: 128
      timeout: 30
      code: ./src/functions/admin-panel
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        WORKER_URL: "https://nano-dev.gcn.net/api"
        TZ: "Asia/Shanghai"
      triggers:
        - triggerName: http-admin
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]

  # Read-only MCP server over BOTH dev databases for the data-analysis workshop
  # (docs/architecture/mcp-server.md). Dev only by design: lib/db.js refuses any database whose
  # name does not end in _dev, and s-prod.yaml deliberately has no mcp block. Pools are capped at
  # 2 connections each — the cluster is shared with GCN prod (CLAUDE.md §32).
  mcp:
    component: fc3
    props:
      region: ${vars.region}
      functionName: nano-mcp-dev
      runtime: nodejs20
      handler: index.handler
      memorySize: 256
      timeout: 90
      code: ./src/functions/mcp
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        DB_HOST: "amclbdsyqvfq.rwlb.rds.aliyuncs.com"
        DB_SSL: "false"
        NANO_DB_NAME: "nano_db_dev"
        NANO_DB_USER: "nano_admin"
        NANO_DB_PASS: ${env(DB_PASS)}
        GCN_DB_NAME: "gcn_db_dev"
        GCN_DB_USER: "gcn_admin"
        GCN_DB_PASS: ${env(GCN_DB_PASS)}
        MCP_API_TOKEN: ${env(MCP_API_TOKEN)}
        TZ: "Asia/Shanghai"
      triggers:
        - triggerName: http-mcp
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["GET", "POST", "DELETE", "OPTIONS"]

  # The twin function (docs/architecture/twin-function.md): an external twin holder's (Curia's)
  # reads of every subject's twin and its contributions back — reports now; extracted values and
  # physician agents' findings next. Its own function so it deploys without touching the worker.
  # shared/ is a byte-identical copy of the worker's bundle modules; pre-deploy re-copies it, and
  # tests/twin-function.test.js fails on drift. Apply migration_twin_sync.sql before first deploy.
  twin:
    component: fc3
    actions:
      pre-deploy:
        - run: node scripts/sync-twin-shared.js
          path: ./
    props:
      region: ${vars.region}
      functionName: twin-dev
      runtime: nodejs20
      handler: index.handler
      memorySize: 512
      timeout: 120
      code: ./src/functions/twin
      role: "acs:ram::1719995052853530:role/aliyunfcdefaultrole"
      logConfig:
        project: ${vars.logProject}
        logstore: ${vars.logStore}
        enableRequestMetrics: true
        enableInstanceMetrics: true
      vpcConfig:
        securityGroupId: "sg-uf6hwn97w4pz60mmfgwz"
        vSwitchIds: ["vsw-uf6438oo047ucsbmlvmxw"]
        vpcId: "vpc-uf6oezl8wt6efyczo7wa4"
      environmentVariables:
        TWIN_ENV: "dev"
        DB_HOST: "amclbdsyqvfq.rwlb.rds.aliyuncs.com"
        DB_NAME: "nano_db_dev"
        # nano_admin until a narrower account exists: it needs SELECT on the twin tables and
        # INSERT/UPDATE on viva_ag_jobs and twin_contributions only. nano_admin cannot CREATE ROLE
        # on this cluster; the account is a console act (PolarDB → Accounts).
        DB_USER: "nano_admin"
        DB_PASS: ${env(DB_PASS)}
        DB_SSL: "false"
        TZ: "Asia/Shanghai"
        # Distinct per environment and from VIVA_AG_API_TOKEN / DOC_EXTRACT_API_TOKEN: this one
        # reads every subject's twin and writes to it. Issue as "twn_" + 32 hex.
        TWIN_API_TOKEN: ${env(TWIN_API_TOKEN)}
        TWIN_SETTLE_SECONDS: "60"
        OSS_REGION: "oss-cn-shanghai"
        OSS_BUCKET: "waven-nano"
        OSS_ACCESS_KEY_ID: ${env(OSS_ACCESS_KEY_ID)}
        OSS_ACCESS_KEY_SECRET: ${env(OSS_ACCESS_KEY_SECRET)}
        OSS_CNAME_DOMAIN: ${env(OSS_CNAME_DOMAIN)}
      triggers:
        - triggerName: http-twin
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: ["GET", "POST"]

  nano-domain:
    component: fc3-domain
    props:
      region: ${vars.region}
      domainName: nano-dev.gcn.net
      protocol: HTTP,HTTPS
      certConfig:
        certName: nano-custom-cert
        certificate: ./certs/cert.pem
        privateKey: ./certs/key.pem
      routeConfig:
        routes:
          - path: /QJaeMN3iR8.txt
            functionName: nano-worker-dev
          # Before /api/*: the twin function owns its own prefix.
          - path: /api/twin/*
            functionName: twin-dev
          - path: /api/*
            functionName: nano-worker-dev
          - path: /api
            functionName: nano-worker-dev
          - path: /app/*
            functionName: nano-user-app-dev
          - path: /app
            functionName: nano-user-app-dev
          - path: /admin/api/*
            functionName: nano-admin-panel-dev
          - path: /admin/*
            functionName: nano-admin-panel-dev
          - path: /admin
            functionName: nano-admin-panel-dev
          - path: /worker
            functionName: nano-worker-dev
          - path: /agent/*
            functionName: nano-agent-dev
          - path: /agent
            functionName: nano-agent-dev
          - path: /kino/*
            functionName: nano-kino-dev
          - path: /kino
            functionName: nano-kino-dev
          - path: /lab/*
            functionName: nano-lab-dev
          - path: /lab
            functionName: nano-lab-dev
          - path: /mcp/*
            functionName: nano-mcp-dev
          - path: /mcp
            functionName: nano-mcp-dev
